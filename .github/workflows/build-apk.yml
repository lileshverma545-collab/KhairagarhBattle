
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Khairagarh Battle APK
    runs-on: ubuntu-22.04

    steps:
      # 1. Download project source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Setup Android SDK without the broken setup-android action
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_SDK_ROOT"

          if [ ! -d "$SDK/cmdline-tools" ]; then
            echo "Android command-line tools directory not found: $SDK"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in Android SDK."
            exit 1
          fi

          echo "Using SDK Manager: $SDKMANAGER"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313"

      # 4. Download Godot 4.3 and Android export templates
      - name: Install Godot 4.3
        shell: bash
        run: |
          set -e

          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"

          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz

          unzip -q godot.zip

          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          unzip -q templates.tpz -d godot-templates

          cp -a godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

          godot --version

      # 5. Create temporary Android debug keystore
      - name: Create Debug Keystore
        shell: bash
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore "$HOME/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9999 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -deststoretype PKCS12

      # 6. Configure Godot Android export settings
      - name: Configure Godot Android Settings
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          for F in editor_settings-4.tres editor_settings-4.3.tres; do
            cat > "$HOME/.config/godot/$F" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

      # 7. Verify Godot project and Android export preset
      - name: Verify Project
        working-directory: game
        shell: bash
        run: |
          set -e

          if [ ! -f project.godot ]; then
            echo "ERROR: game/project.godot not found."
            exit 1
          fi

          if [ ! -f export_presets.cfg ]; then
            echo "ERROR: game/export_presets.cfg not found."
            exit 1
          fi

          if ! grep -q 'name="Android"' export_presets.cfg; then
            echo 'ERROR: Android export preset not found. Preset name must be Android.'
            exit 1
          fi

          echo "Godot project and Android preset verified."

      # 8. Import project resources
      - name: Import Godot Project
        working-directory: game
        shell: bash
        run: |
          set -e
          godot --headless --editor --path . --import

      # 9. Export Android APK
      - name: Export Android APK
        working-directory: game
        shell: bash
        run: |
          set -e

          godot --headless --path . \
            --export-debug "Android" ../KhairagarhBattle.apk

          if [ ! -s ../KhairagarhBattle.apk ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh ../KhairagarhBattle.apk

      # 10. Upload APK as GitHub Actions artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhairagarhBattle-APK
          path: KhairagarhBattle.apk
          if-no-files-found: error
          retention-days: 30

      # 11. Attach APK to GitHub Release when pushing a version tag
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KhairagarhBattle.apk
