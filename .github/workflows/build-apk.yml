
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  ANDROID_NDK_VERSION: "23.2.8568313"

jobs:
  build:
    name: Build Khairagarh Battle APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          set -e
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Download Godot 4.3
        run: |
          set -e

          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"

          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip

          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz

          unzip -q godot.zip

          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

          sudo chmod +x /usr/local/bin/godot

          godot --version

      - name: Install Godot Export Templates
        run: |
          set -e

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p templates

          unzip -q templates.tpz -d templates

          cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

          ls -la "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Create Android Debug Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$HOME/debug.keystore" \
            -storetype JKS \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android Settings
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Check Godot Project
        working-directory: game
        run: |
          set -e

          if [ ! -f project.godot ]; then
            echo "ERROR: game/project.godot not found!"
            exit 1
          fi

          godot --headless --editor --path . --import

      - name: Export Android APK
        working-directory: game
        run: |
          set -e

          godot --headless \
            --path . \
            --export-debug "Android" ../KhairagarhBattle.apk

          if [ ! -s ../KhairagarhBattle.apk ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          ls -lh ../KhairagarhBattle.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhairagarhBattle-APK
          path: KhairagarhBattle.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KhairagarhBattle.apk
